<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <a routerLink="/matriculas" class="brand-name">{{ title }}</a>
      <p class="brand-sub">Sistema acadêmico</p>
    </div>
    <nav class="nav" aria-label="Principal">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
        >{{ link.label }}</a>
      }
    </nav>
    <p
      class="api-pill"
      [class.api-ok]="apiStatus() === 'UP'"
      [class.api-off]="apiStatus() === 'offline'"
      [attr.title]="'Status da API: ' + apiStatus()"
    >
      <span class="api-dot" aria-hidden="true"></span>
      API {{ apiStatus() }}
    </p>
  </aside>
  <main class="content">
    <router-outlet />
  </main>
</div>
<app-toast-container />
<app-confirm-dialog />
