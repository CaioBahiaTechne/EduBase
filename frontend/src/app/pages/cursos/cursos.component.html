<section class="page">
  <header class="page-head">
    <h2>Cursos</h2>
    <p>Cursos da instituição.</p>
  </header>

  @if (erro) {
    <p class="msg msg-erro" role="alert">{{ erro }}</p>
  }
  @if (sucesso) {
    <p class="msg msg-ok">{{ sucesso }}</p>
  }

  <form class="form-panel" (ngSubmit)="salvar()">
    <h3>{{ editandoId == null ? 'Novo curso' : 'Editar curso #' + editandoId }}</h3>
    <label>
      Nome
      <input name="nome" [(ngModel)]="form.nome" required />
    </label>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <button type="button" class="btn" (click)="iniciarNovo()">Limpar</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (c of cursos; track c.id) {
          <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nome }}</td>
            <td class="row-actions">
              <button type="button" class="btn btn-sm" (click)="editar(c)">Editar</button>
              <button type="button" class="btn btn-sm btn-danger" (click)="excluir(c)">Excluir</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="empty">Nenhum curso cadastrado.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
