<section class="page">
  <header class="page-head">
    <h2>Alunos</h2>
    <p>Cadastro e manutenção de estudantes.</p>
  </header>

  <form class="form-panel" (ngSubmit)="salvar()">
    <h3>{{ editandoId == null ? 'Novo aluno' : 'Editar aluno #' + editandoId }}</h3>
    <div class="form-grid">
      <label>
        Nome
        <input name="nome" [(ngModel)]="form.nome" required autocomplete="name" />
      </label>
      <label>
        E-mail
        <input name="email" type="email" [(ngModel)]="form.email" required autocomplete="email" />
      </label>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <button type="button" class="btn" (click)="iniciarNovo()">Limpar</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (a of alunos; track a.id) {
          <tr>
            <td data-label="ID">{{ a.id }}</td>
            <td data-label="Nome">{{ a.nome }}</td>
            <td data-label="E-mail">{{ a.email }}</td>
            <td class="row-actions">
              <button type="button" class="btn btn-sm" (click)="editar(a)">Editar</button>
              <button type="button" class="btn btn-sm btn-danger" (click)="excluir(a)">Excluir</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="empty">Nenhum aluno cadastrado.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
