<section class="page">
  <header class="page-head">
    <h2>Disciplinas</h2>
    <p>Disciplinas vinculadas a um curso.</p>
  </header>

  <form class="form-panel" (ngSubmit)="salvar()">
    <h3>{{ editandoId == null ? 'Nova disciplina' : 'Editar disciplina #' + editandoId }}</h3>
    <div class="form-grid">
      <label>
        Nome
        <input name="nome" [(ngModel)]="form.nome" required />
      </label>
      <label>
        Curso
        <select name="cursoId" [(ngModel)]="form.cursoId" required>
          <option [ngValue]="null" disabled>Selecione...</option>
          @for (c of cursos; track c.id) {
            <option [ngValue]="c.id">{{ c.nome }}</option>
          }
        </select>
      </label>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <button type="button" class="btn" (click)="iniciarNovo()">Limpar</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Curso</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (d of disciplinas; track d.id) {
          <tr>
            <td data-label="ID">{{ d.id }}</td>
            <td data-label="Nome">{{ d.nome }}</td>
            <td data-label="Curso">{{ d.cursoNome }}</td>
            <td class="row-actions">
              <button type="button" class="btn btn-sm" (click)="editar(d)">Editar</button>
              <button type="button" class="btn btn-sm btn-danger" (click)="excluir(d)">Excluir</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="empty">Nenhuma disciplina cadastrada.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
